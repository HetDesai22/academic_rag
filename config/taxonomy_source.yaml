            description: Biological and artificial neurons, McCulloch-Pitts model, perceptron and its constraints, ADALINE, weights, summation junction, and implementing logic gates.
            keywords: [neuron, perceptron, mcculloch, adaline, biological]
          Activation Functions:
            description: Activation functions such as ReLU, softmax, sigmoid and threshold functions.
            keywords: [activation function, relu, soft max, softmax, sigmoid]
          Neural Network Fundamentals:
            description: Key components, architectures, properties, advantages, applications and cost function of neural networks, weights and hyper parameters.
            keywords: [neural network, hyper parameter, weights]
          Multilayer Feed Forward Networks:
            description: Single layer and multilayer feed forward neural networks and their architecture.
            keywords: [feed forward, multilayer, multi-layer]
          Backpropagation:
            description: The backpropagation algorithm, its steps, advantages, limitations, and selecting hidden units.
            keywords: [backpropagation, back propagation]
          Deep Neural Networks:
            description: Deep learning, deep neural networks and recurrent neural networks.
            keywords: [deep learning, deep neural network, recurrent neural network]
      Computational and Ensemble Learning:
        syllabus_unit: 7
        description: Introduction to computational learning, sample complexity for finite hypothesis space, VC dimension, ensembles, bagging and boosting.
        subtopics:
          Computational Learning Theory:
            description: Computational learning models, sample complexity, number of training examples needed, VC dimension and VC bound.
            keywords: [vc dimension, vapnik, sample complexity, computational learning]
          Ensemble Learning Concepts:
            description: What ensemble learning is, types of ensemble algorithms, voting and stacking, variance and bias reduction.
            keywords: [ensemble, voting, stacking]
          Bagging and Random Forest:
            description: Bagging or bootstrap aggregation, its steps, advantages and disadvantages, and random forest built from decision trees.
            keywords: [bagging, bootstrap aggregation, random forest]
          Boosting:
            description: Boosting and AdaBoost, their benefits and drawbacks, and difference between bagging and boosting.
            keywords: [boosting, adaboost]
      Basic Concepts of Clustering:
        syllabus_unit: 8
        description: Introduction to clustering, K-means clustering, agglomerative hierarchical clustering.
        subtopics:
          Clustering Concepts:
            description: Introduction to clustering, desirable properties, categories and criteria of clustering algorithms, and differences between clustering and classification.
            keywords: [clustering, properties of clustering]
          K-Means Clustering:
            description: The K-means clustering algorithm, its working, advantages and disadvantages.
            keywords: [k-means, k means, k-mean]
          Hierarchical Clustering:
            description: Agglomerative hierarchical clustering.
            keywords: [hierarchical, agglomerative]

