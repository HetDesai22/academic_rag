            keywords: [hypothesis, hypothesis space, inductive bias]
          Evaluation and Cross Validation:
            description: Model evaluation, k-fold cross validation, leave-one-out cross validation, confusion matrix, accuracy, recall, specificity, Type I and Type II errors.
            keywords: [cross validation, k-fold, loocv, confusion matrix, accuracy, recall, type i]
      Basic Machine Learning Algorithms:
        syllabus_unit: 2
        description: Linear regression, decision trees, learning decision trees, k-nearest neighbour, collaborative filtering, overfitting.
        subtopics:
          Linear Regression:
            description: Linear regression with one variable, evaluating and designing a linear regressor.
            keywords: [linear regression, linear regressor]
          Decision Trees:
            description: Decision tree learning algorithm, node types, terminology, entropy, and using decision trees for classification.
            keywords: [decision tree, entropy]
          K-Nearest Neighbour:
            description: K-nearest neighbour model, distance metrics, advantages and disadvantages, and difference from k-means.
            keywords: [knn, k-nearest, nearest neighbor, nearest neighbour]
          Collaborative Filtering:
            description: Principle of collaborative filtering for recommendation.
            keywords: [collaborative filtering]
          Overfitting and Bias-Variance:
            description: Overfitting and underfitting, reasons and strategies to avoid overfitting, bias and variance trade-off.
            keywords: [overfitting, over fitting, underfitting, bias and variance]
          Classification and Regression:
            description: Classification versus regression in supervised learning.
            keywords: [classification and regression, regression and classification]
      Dimensionality Reduction:
        syllabus_unit: 3
        description: Feature selection and feature extraction.
        subtopics:
          Dimensionality Reduction Concepts:
            description: What dimensionality reduction is, high dimensional datasets, types and techniques of dimensionality reduction and difference from feature selection.
            keywords: [dimensionality reduction, high dimensional]
          Feature Selection:
            description: Feature selection, its need and approaches such as filter, wrapper and embedded, feature relevance and redundancy measures.
            keywords: [feature selection, filter, wrapper, embedded, redundancy]
          Feature Extraction and PCA:
            description: Feature extraction techniques and principal component analysis.
            keywords: [feature extraction, principal component analysis, pca]
      Bayesian Concept of Learning:
        syllabus_unit: 4
        description: Bayesian learning, naive Bayes, Bayesian network, exercises on naive Bayes.
        subtopics:
          Bayesian Learning and Bayes Theorem:
            description: Bayes theorem, prior and posterior, advantages, features and limitations of Bayesian learning and Bayes classification, including numerical problems using Bayes theorem.
            keywords: [bayes theorem, bayesian learning, prior, posterior]
          Naive Bayes Classifier:
            description: The naive Bayes classifier, why it is called naive, its applications and advantages, and naive Bayes numerical exercises.
            keywords: [naive bayes, naïve bayes, naive bays]
          Bayesian Network:
            description: Bayesian belief networks.
            keywords: [bayesian network, belief network]
      Logistic Regression and Support Vector Machine:
        syllabus_unit: 5
        description: Logistic regression, introduction to SVM, dual formulation, maximum margin with noise, nonlinear SVM and kernel function, solution to the dual problem.
        subtopics:
          Logistic Regression:
            description: Logistic regression, its implementation and difference from linear regression.
            keywords: [logistic regression, logistic repressor]
          SVM Fundamentals and Maximum Margin:
            description: Support vector machine model, support vectors, maximum margin, key properties, applications, advantages and implementation of SVM, comparison with neural networks.
            keywords: [svm, support vector, maximum margin, margin]
          Soft Margin SVM:
            description: Maximum margin with noise, soft margins for handling outliers and noise.
            keywords: [soft margin, noise, outliers]
          Kernels and Nonlinear SVM:
            description: Kernel functions, the kernel method, and nonlinear SVM.
            keywords: [kernel, nonlinear svm, non linear kernels]
          SVM Dual Problem:
            description: The dual formulation of SVM and its solution.
            keywords: [dual]
      Basics of Neural Network:
        syllabus_unit: 6
        description: Introduction to neural network, multilayer neural network, neural network and backpropagation, deep neural network.
        subtopics:
